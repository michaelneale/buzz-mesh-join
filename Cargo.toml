[package]
name = "buzz-mesh-join"
version = "0.1.0"
edition = "2021"
description = "Headless: join a stock mesh-llm node to a Buzz community (NIP-43 roster -> owner allowlist)"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "=3.0.0"
hex = "0.4"
mesh-llm-identity = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.78.1", features = ["host-io"] }
nostr-sdk = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time"] }
